version: "3.8"

services:
  # ----------------------------------------------------------------------------
  # Aegis Backend: Dual-Stage ML, Graph Topology & ERSS Dispatch Service
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    container_name: aegis_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONIOENCODING=utf-8
      - HOST=0.0.0.0
      - PORT=8000
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ../data_generator:/app/data_generator
      - ../ml_models/artifacts:/app/ml_models/artifacts
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - aegis_network

  # ----------------------------------------------------------------------------
  # Aegis Frontend: Next.js 14 Tactical Command Center Dashboard
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    container_name: aegis_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_BASE=http://localhost:8000/api/v1
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/ws/alerts
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - aegis_network

  # ----------------------------------------------------------------------------
  # Redis: Tactical Cache & High-Speed Event Buffer
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: aegis_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - aegis_network

networks:
  aegis_network:
    driver: bridge

volumes:
  redis_data:
